<div class="container">
  <h1 class="page-title">Ajustes</h1>
  <p class="page-subtitle">Preferencias de la aplicación</p>

  <mat-card class="section">
    <mat-card-header>
      <mat-icon mat-card-avatar>schedule</mat-icon>
      <mat-card-title>Zona horaria</mat-card-title>
      <mat-card-subtitle>Las fechas y horas se muestran en esta zona</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div class="tz-row">
        <mat-form-field appearance="outline">
          <mat-label>Zona horaria</mat-label>
          <mat-select [(ngModel)]="timezone">
            @for (tz of timezones; track tz) {
              <mat-option [value]="tz">{{ tz }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
        <button mat-raised-button color="primary" (click)="save()" [disabled]="saving()">
          {{ saving() ? 'Guardando…' : 'Guardar' }}
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
