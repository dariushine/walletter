<div class="dlg">
  <div class="dlg-head">
    <h2 class="dlg-title">Nuevo exchange</h2>
    <button mat-icon-button class="dlg-close" (click)="cancel()" aria-label="Cerrar">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <mat-dialog-content class="dlg-content">
    <form [formGroup]="form" class="dlg-form">
      <div class="dlg-row">
        <mat-form-field appearance="outline">
          <mat-label>Billetera origen *</mat-label>
          <mat-select formControlName="fromWalletId">
            @for (w of data.wallets; track w.id) {
              <mat-option [value]="w.id">{{ w.name }} ({{ w.currency }})</mat-option>
            }
          </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Billetera destino *</mat-label>
          <mat-select formControlName="toWalletId">
            @for (w of data.wallets; track w.id) {
              <mat-option [value]="w.id">{{ w.name }} ({{ w.currency }})</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>

      <div class="dlg-row">
        <mat-form-field appearance="outline">
          <mat-label>Monto enviado *</mat-label>
          <input matInput formControlName="fromAmount" type="number" min="0" step="0.01" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Monto recibido *</mat-label>
          <input matInput formControlName="toAmount" type="number" min="0" step="0.01" />
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="dlg-full">
        <mat-label>Descripción</mat-label>
        <input matInput formControlName="description" />
      </mat-form-field>

      <details class="dlg-details">
        <summary>Detalles</summary>
        <div class="dlg-details-body">
          <div class="dlg-row">
            <mat-form-field appearance="outline">
              <mat-label>Fecha</mat-label>
              <input matInput formControlName="date" type="date" />
            </mat-form-field>
            <mat-form-field appearance="outline">
              <mat-label>Hora</mat-label>
              <input matInput formControlName="time" type="time" />
            </mat-form-field>
          </div>
          <div class="dlg-row">
            <mat-form-field appearance="outline">
              <mat-label>Comisión débito</mat-label>
              <input matInput formControlName="fee" type="number" min="0" step="0.01" />
            </mat-form-field>
            <mat-form-field appearance="outline">
              <mat-label>Comisión crédito</mat-label>
              <input matInput formControlName="creditFee" type="number" min="0" step="0.01" />
            </mat-form-field>
          </div>
        </div>
      </details>
    </form>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="dlg-action">
    <button mat-button (click)="cancel()">Cancelar</button>
    <button mat-flat-button color="primary" (click)="save()" [disabled]="form.invalid || loading()">
      {{ loading() ? 'Guardando…' : 'Registrar Exchange' }}
    </button>
  </mat-dialog-actions>
</div>
