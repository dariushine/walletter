<h2 mat-dialog-title>{{ dialogTitle() }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="tx-form">
    @if (!hideType()) {
      <mat-radio-group formControlName="type" class="type-radio">
        <mat-radio-button value="expense" color="warn">Gasto</mat-radio-button>
        <mat-radio-button value="income" color="primary">Ingreso</mat-radio-button>
      </mat-radio-group>
    }

    <mat-form-field appearance="outline" class="full">
      <mat-label>Billetera</mat-label>
      <mat-select formControlName="walletId">
        @for (w of data.wallets; track w.id) {
          <mat-option [value]="w.id">{{ w.name }} ({{ w.currency }})</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <div class="form-row two">
      <mat-form-field appearance="outline">
        <mat-label>Categoría</mat-label>
        <input matInput formControlName="categoryName" />
      </mat-form-field>
      <app-money-input
        formControlName="amount"
        label="Monto"
        [currency]="selectedCurrency()"
      />
    </div>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Descripción</mat-label>
      <input matInput formControlName="description" />
    </mat-form-field>

    <div class="form-row two">
      <mat-form-field appearance="outline">
        <mat-label>Fecha</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="date" />
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Hora</mat-label>
        <input matInput formControlName="time" type="time" />
      </mat-form-field>
    </div>

    <app-money-input
      formControlName="fee"
      label="Comisión (fee)"
      [currency]="selectedCurrency()"
    />
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid || loading()">
    {{ loading() ? 'Guardando…' : 'Guardar' }}
  </button>
</mat-dialog-actions>
