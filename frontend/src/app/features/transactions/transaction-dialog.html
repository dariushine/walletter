<div class="op-dialog">
  <div class="op-head">
    <h2 class="op-title">{{ dialogTitle() }}</h2>
    <button mat-icon-button class="op-close" (click)="cancel()" aria-label="Cerrar">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <mat-dialog-content class="op-content">
    <form [formGroup]="form" class="op-form">
      @if (!hideType()) {
        <div class="type-toggle">
          <button
            type="button"
            class="type-btn expense"
            [class.active]="form.value.type === 'expense'"
            (click)="setType('expense')"
          >
            <mat-icon>remove</mat-icon> Gasto
          </button>
          <button
            type="button"
            class="type-btn income"
            [class.active]="form.value.type === 'income'"
            (click)="setType('income')"
          >
            <mat-icon>add</mat-icon> Ingreso
          </button>
        </div>
      }

      <mat-form-field appearance="outline" class="full">
        <mat-label>Billetera *</mat-label>
        <mat-select formControlName="walletId">
          @for (w of data.wallets; track w.id) {
            <mat-option [value]="w.id">{{ w.name }} ({{ w.currency }})</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <app-money-input
        formControlName="amount"
        label="Monto *"
        [currency]="selectedCurrency()"
        [full]="true"
      />

      <app-category-autocomplete
        formControlName="categoryName"
        [type]="form.value.type"
        class="full"
      />

      <mat-form-field appearance="outline" class="full">
        <mat-label>Descripción</mat-label>
        <input matInput formControlName="description" />
      </mat-form-field>

      <details class="op-details">
        <summary>Detalles</summary>
        <div class="details-body">
          <div class="form-row two">
            <mat-form-field appearance="outline">
              <mat-label>Fecha</mat-label>
              <input matInput [matDatepicker]="picker" formControlName="date" />
              <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
              <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>
            <mat-form-field appearance="outline">
              <mat-label>Hora</mat-label>
              <input matInput formControlName="time" type="time" />
            </mat-form-field>
          </div>
          <app-money-input
            formControlName="fee"
            label="Comisión (opcional)"
            [currency]="selectedCurrency()"
            [full]="true"
          />
        </div>
      </details>
    </form>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="op-actions">
    <button mat-button (click)="cancel()">Cancelar</button>
    <button
      mat-flat-button
      [color]="form.value.type === 'expense' ? 'warn' : 'primary'"
      (click)="save()"
      [disabled]="form.invalid || loading()"
    >
      {{ loading() ? 'Guardando…' : 'Guardar' }}
    </button>
  </mat-dialog-actions>
</div>
