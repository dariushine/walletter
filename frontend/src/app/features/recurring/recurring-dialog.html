<h2 mat-dialog-title>{{ isEdit ? 'Editar pago recurrente' : 'Nuevo pago recurrente' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="rec-form">
    <mat-form-field appearance="outline" class="full">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>

    <mat-radio-group formControlName="type" class="type-radio">
      <mat-radio-button value="expense" color="warn">Gasto</mat-radio-button>
      <mat-radio-button value="income" color="primary">Ingreso</mat-radio-button>
    </mat-radio-group>

    <div class="form-row two">
      <app-money-input
        formControlName="amount"
        label="Monto"
        [currency]="currencyValue()"
      />
      <mat-form-field appearance="outline">
        <mat-label>Moneda</mat-label>
        <mat-select formControlName="currency">
          @for (c of currencies; track c) {
            <mat-option [value]="c">{{ c }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <app-category-autocomplete
      formControlName="categoryName"
      [type]="form.value.type"
      class="full"
    />

    <mat-form-field appearance="outline" class="full">
      <mat-label>Billetera</mat-label>
      <mat-select formControlName="walletId">
        <mat-option [value]="null">Sin asignar</mat-option>
        @for (w of data.wallets; track w.id) {
          <mat-option [value]="w.id">{{ w.name }} ({{ w.currency }})</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Descripción (opcional)</mat-label>
      <input matInput formControlName="description" />
    </mat-form-field>

    <app-money-input
      formControlName="fee"
      label="Comisión (opcional)"
      [currency]="currencyValue()"
      [full]="true"
    />
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancelar</button>
  <button
    mat-raised-button
    color="primary"
    (click)="save()"
    [disabled]="form.invalid || loading"
  >
    {{ loading ? 'Guardando…' : (isEdit ? 'Guardar' : 'Crear') }}
  </button>
</mat-dialog-actions>
