<h2 mat-dialog-title>Nuevo pago recurrente</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="rec-form">
    <mat-form-field appearance="outline" class="full">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name" required />
    </mat-form-field>

    <mat-radio-group formControlName="type" class="type-radio">
      <mat-radio-button value="expense" color="warn">Gasto</mat-radio-button>
      <mat-radio-button value="income" color="primary">Ingreso</mat-radio-button>
    </mat-radio-group>

    <div class="pair">
      <mat-form-field appearance="outline" class="full">
        <mat-label>Monto</mat-label>
        <input matInput formControlName="amount" type="number" min="0" step="0.01" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="full">
        <mat-label>Comisión</mat-label>
        <input matInput formControlName="fee" type="number" min="0" step="0.01" />
      </mat-form-field>
    </div>

    <div class="pair">
      <mat-form-field appearance="outline" class="full">
        <mat-label>Moneda</mat-label>
        <mat-select formControlName="currency">
          @for (c of currencies; track c) {
            <mat-option [value]="c">{{ c }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline" class="full">
        <mat-label>Categoría</mat-label>
        <input matInput formControlName="categoryName" />
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Billetera</mat-label>
      <mat-select formControlName="walletId">
        <mat-option [value]="null">Sin asignar</mat-option>
        @for (w of data.wallets; track w.id) {
          <mat-option [value]="w.id">{{ w.name }} ({{ w.currency }})</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="form.invalid || loading">
    {{ loading ? 'Guardando…' : 'Guardar' }}
  </button>
</mat-dialog-actions>
