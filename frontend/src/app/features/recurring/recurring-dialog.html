<div class="dlg">
  <div class="dlg-head">
    <h2 class="dlg-title">{{ isEdit ? 'Editar pago recurrente' : 'Nuevo pago recurrente' }}</h2>
    <button mat-icon-button class="dlg-close" (click)="cancel()" aria-label="Cerrar">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <mat-dialog-content class="dlg-content">
    <form [formGroup]="form" class="dlg-form">
      <mat-form-field appearance="outline" class="dlg-full">
        <mat-label>Nombre *</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>

      <!-- Toggle Gasto / Ingreso -->
      <div class="dlg-toggle">
        <button
          type="button"
          class="dlg-type expense"
          [class.active]="form.value.type === 'expense'"
          (click)="changeType('expense')"
        >
          <mat-icon>remove</mat-icon> Gasto
        </button>
        <button
          type="button"
          class="dlg-type income"
          [class.active]="form.value.type === 'income'"
          (click)="changeType('income')"
        >
          <mat-icon>add</mat-icon> Ingreso
        </button>
      </div>

      <div class="dlg-row">
        <mat-form-field appearance="outline">
          <mat-label>Monto *</mat-label>
          <input matInput formControlName="amount" type="number" min="0" step="0.01" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Moneda *</mat-label>
          <mat-select formControlName="currency">
            @for (c of currencies; track c) {
              <mat-option [value]="c">{{ c }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>

      <app-category-autocomplete
        formControlName="categoryName"
        [type]="form.value.type"
        class="dlg-full"
      />

      <mat-form-field appearance="outline" class="dlg-full">
        <mat-label>Billetera</mat-label>
        <mat-select formControlName="walletId">
          <mat-option [value]="null">Sin asignar</mat-option>
          @for (w of data.wallets; track w.id) {
            <mat-option [value]="w.id">{{ w.name }} ({{ w.currency }})</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <details class="dlg-details">
        <summary>Detalles</summary>
        <div class="dlg-details-body">
          <mat-form-field appearance="outline" class="dlg-full">
            <mat-label>Comisión</mat-label>
            <input matInput formControlName="fee" type="number" min="0" step="0.01" />
          </mat-form-field>
        </div>
      </details>
    </form>
  </mat-dialog-content>
  <mat-dialog-actions align="end" class="dlg-action">
    <button mat-button (click)="cancel()">Cancelar</button>
    <button
      mat-flat-button
      [color]="form.value.type === 'expense' ? 'warn' : 'primary'"
      (click)="save()"
      [disabled]="form.invalid || loading"
    >
      {{ loading ? 'Guardando…' : (isEdit ? 'Guardar' : 'Crear') }}
    </button>
  </mat-dialog-actions>
</div>
