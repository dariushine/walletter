<div class="container">
  <header class="head-row">
    <div>
      <h1 class="page-title">Categorías</h1>
      <p class="page-subtitle">Organiza tus transacciones por categoría</p>
    </div>
    <button mat-raised-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon> Nueva categoría
    </button>
  </header>

  <!-- Toggle Gasto / Ingreso -->
  <div class="toggle-bar">
    <div class="segmented">
      <button
        type="button"
        class="seg-btn"
        [class.active]="filterType() === 'expense'"
        (click)="setFilter('expense')"
      >Gastos</button>
      <button
        type="button"
        class="seg-btn"
        [class.active]="filterType() === 'income'"
        (click)="setFilter('income')"
      >Ingresos</button>
      <button
        type="button"
        class="seg-btn"
        [class.active]="filterType() === 'all'"
        (click)="setFilter('all')"
      >Todos</button>
    </div>
  </div>

  @if (loading()) {
    <mat-spinner class="spinner" />
  } @else {
    <div class="cat-grid">
      @for (c of currentFiltered(); track c.id) {
        <mat-card class="cat-card">
          <mat-card-content>
            <div class="cat-head">
              <mat-icon class="cat-icon" [class.income]="c.type === 'income'" [class.expense]="c.type === 'expense'">
                {{ c.type === 'income' ? 'arrow_upward' : 'arrow_downward' }}
              </mat-icon>
              <span class="cat-name">{{ c.name }}</span>
              <span class="cat-actions">
                @if (!isProtected(c)) {
                  <button mat-icon-button (click)="edit(c)" aria-label="Editar"><mat-icon>edit</mat-icon></button>
                  <button mat-icon-button (click)="delete(c)" aria-label="Eliminar"><mat-icon>delete</mat-icon></button>
                }
              </span>
            </div>
          </mat-card-content>
        </mat-card>
      } @empty {
        <mat-card><mat-card-content class="empty">Sin categorías.</mat-card-content></mat-card>
      }
    </div>
  }
</div>
